version: '3.8'

services:     
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server_container
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "Your_strong_password1!"
      ACCEPT_EULA: "Y"
    networks:
      - app-network  
    volumes:
      - sql_data:/var/opt/mssql
    restart: unless-stopped      

  web:
    image: ghcr.io/fercruz177/ejemplomvc-web:v1
    container_name: aspnet_app
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - db
    networks:
      - app-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=TodoDB;User=sa;Password=Your_strong_password1!;TrustServerCertificate=True;

  init-db:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      - db
    volumes:
      - ./init.sql:/init.sql
    entrypoint: >
      bash -c "
        echo 'Esperando que SQL Server esté listo...' &&
        sleep 20 &&
        /opt/mssql-tools/bin/sqlcmd -S db -U sa -P 'Your_strong_password1!' -i /init.sql
      "
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  sql_data:    